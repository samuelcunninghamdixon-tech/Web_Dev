version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: local-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agency}
      POSTGRES_USER: ${POSTGRES_USER:-agency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agency}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - agency-network

  ollama:
    image: ollama/ollama:latest
    container_name: local-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - agency-network

  n8n:
    image: n8nio/n8n:latest
    container_name: local-ai-n8n
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-agency}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-agency}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-agency}
      N8N_BASIC_AUTH_ACTIVE: false
    depends_on:
      - postgres
    networks:
      - agency-network

  agent-service:
    build:
      context: ./services/agent
    container_name: local-ai-agent
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://agency:agency@postgres:5432/agency}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    depends_on:
      - postgres
      - ollama
    ports:
      - "8001:8000"
    networks:
      - agency-network

  scraper-service:
    build:
      context: ./services/scraper
    container_name: local-ai-scraper
    env_file:
      - .env
    depends_on:
      - ollama
    ports:
      - "8002:8000"
    networks:
      - agency-network

volumes:
  postgres_data:
  ollama_data:

networks:
  agency-network:
    driver: bridge
